[package]
name = "esp32-hw-probe"
version = "0.1.0"
authors = ["Daniel Vena <deaconvena+bambino@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"
repository = "https://github.com/vena/bambino"
description = "Bare-metal hardware probe harness for bambino's ESP-IDF target. Not published."
license = "AGPL-3.0"
publish = false

[[bin]]
name = "esp32-hw-probe"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
# Path dep on the crate under test so a probe exercises the *shipped* type rather than a
# copy of it — a reimplementation here could pass while the real code still fails. Fine
# despite the root `exclude = ["esp32-hw-probe/"]`: that only keeps this directory out of
# the published tarball, it doesn't make bambino unusable as a local path dependency.
bambino = { path = "..", default-features = false, features = ["esp-idf"] }
# Concurrency combinators for probes that need two futures live on one executor at once
# (the single-task interleave is the only way to share an `EspIdfTimer` — its `RefCell`
# isn't `Sync`, so `Arc`-ing one across threads doesn't compile).
embassy-futures = "0.1"

[build-dependencies]
embuild = "0.33"
