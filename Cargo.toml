[package]
name = "bambino"
version = "0.1.0"
edition = "2024"
# Already implied by `edition = "2024"` (stabilized in 1.85) and matched by `mbedtls-rs` 0.3's
# own floor — declared so a too-old toolchain fails with a clear MSRV error instead of a wall
# of edition-2024 parse errors.
rust-version = "1.85"
authors = ["vena <deaconvena+bambino@gmail.com>"]
description = "A multi-platform, asynchronous Rust library for direct local network control of Bambu Lab 3D printers."
license = "AGPL-3.0"
repository = "https://github.com/vena/bambino"
keywords = ["bambu", "3d-printing", "mqtt", "ftps", "no-std"]
categories = ["network-programming", "embedded", "no-std", "hardware-support", "api-bindings"]
exclude = ["esp32-hw-probe/", "embassy-hw-probe/"]

[features]
# Default features: compilation targeting high-capability host systems using Tokio and Rustls
default = ["std", "tokio"]

# Standard library support flag
std = ["serde/std", "serde_json/std"]

# Tokio-specific dependencies and platform bridges
tokio = ["dep:tokio", "dep:tokio-rustls", "dep:rustls-pki-types", "dep:x509-parser", "std"]

# bambino-cli only: terminal manipulation and a concrete log sink. Not implied by
# `tokio` so library consumers depending on `bambino` with default features don't
# pull in a terminal UI crate and a log sink they never asked for.
cli = ["dep:env_logger", "dep:crossterm", "dep:clap", "dep:time", "dep:unicode-width", "dep:thiserror", "tokio"]

# ESP-IDF specific features for embedded platforms running FreeRTOS with std library support
# `dep:embuild` is a build-dependency: `build.rs` needs it to re-emit the `esp_idf_*`
# kconfig cfgs that `esp-idf-sys` propagates through `esp-idf-svc`. Without it, gates like
# `#[cfg(esp_idf_mbedtls_certificate_bundle)]` in `io/esp_idf.rs` compile but are always
# false — see the comment on `build.rs`.
esp-idf = ["dep:esp-idf-svc", "dep:socket2", "dep:embuild", "std"]

# Dynamic allocation support flag (enables string manipulation on bare-metal environments)
# Propagates the required allocation features to both serde and serde_json core libraries.
alloc = ["serde/alloc", "serde_json/alloc"]

# Embassy-net framework support with mbedtls-rs (real TLS 1.2+1.3, hw-accelerated on ESP32)
# and async IO bindings. See 405436e986a67fe470cc7170bdf85278b772d225 for when mbedtls-rs
# replaced embedded-tls (TLS-1.3-only) here.
embassy = [
    "dep:embassy-net",
    "dep:embassy-time",
    "dep:mbedtls-rs",
    "dep:embassy-sync",
    "dep:rand_core",
    "alloc",
]

[[bin]]
name = "bambino-cli"
path = "src/bin/bambino-cli/main.rs"
required-features = ["cli"]

[dependencies]
# Structured logging facade (no_std compatible with default-features disabled)
log = { version = "0.4", default-features = false }

# Serialization and schema definitions
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.150", default-features = false }

# Embedded/no_std-compatible asynchronous IO traits
embedded-io-async = { version = "0.7.0" }

# Error formatting mapping (only available on host architectures running std)
thiserror = { version = "2.0.18", optional = true }

# Zero-copy HTTP response and header parsing.
# Configured with default-features disabled to ensure compatibility with no_std/Embassy environments.
httparse = { version = "1.10.1", default-features = false }

# Host runtime and network transport layer
# Enabled "io-util", "macros", and "rt-multi-thread" features of tokio to support async main binaries and select macros.
tokio = { version = "1.52.3", features = [
    "net",
    "time",
    "rt",
    "sync",
    "io-util",
    "macros",
    "rt-multi-thread",
], optional = true }
tokio-rustls = { version = "0.26.4", features = [
    "ring",
    "tls12",
], optional = true }
rustls-pki-types = { version = "1.14", optional = true }

# X.509 parsing for the "verified" TLS path's CnFallbackServerVerifier (src/io/tokio.rs).
# Unlike rustls-webpki, this does not enforce a v3-only policy (real Bambu printer certs are
# X.509 v1) — see commit 8b80acc46817786dca8801daa38d85d02d3104f0. "verify" feature pulls in
#`ring`-backed cert-signature verification (X509Certificate::verify_signature), reusing the
# same crypto backend already used elsewhere via rustls's ring provider.
x509-parser = { version = "0.18", features = ["verify"], optional = true }

# ESP-IDF system services binding for hardware transport
esp-idf-svc = { version = "0.53.0", optional = true }

# Low-level socket configuration for a non-blocking TCP `connect()` on ESP-IDF — the
# nonblocking flag must be set before `connect()` is called on a not-yet-connected socket,
# which `std::net::TcpStream::connect()`'s all-in-one API doesn't allow.
socket2 = { version = "0.6", optional = true }

# Embassy runtime stack components (for bare-metal integrations)
#
# WARNING: do not change the `embassy-net` version (or let the TCP stack under it change)
# without re-running the hardware check. bambino must close every TCP connection cleanly, so
# the printer is always told it has ended. embassy-net's own `TcpClient` cannot: dropping a
# `TcpConnection` removes the socket before its FIN is sent. `io/embassy.rs` therefore never
# removes a socket. It pools them, ends each connection with `close()` (an `abort()` RST only
# after a bound), and reuses the socket once the printer has closed its side. That relies on
# stack behavior the compiler cannot check:
#   - a socket left registered after `close()`/`abort()` still sends its FIN/RST;
#   - `connect()` accepts a socket in `Closed`/`TimeWait`;
#   - `close()` does not reset the socket timeout clock (smoltcp 0.13.1; xarxa differs),
#     which is why the pool bounds closing itself instead of using `set_timeout`.
# Before changing it: `make test-embassy-host`, then the socket-teardown stages of
# `embassy-hw-probe` against a printer (see that directory's README).
#
# Explicitly propagate "proto-ipv4" and "medium-ethernet" features to satisfy smoltcp stack requirements
# when default-features are disabled in non-std environments.
embassy-net = { version = "0.9.1", default-features = false, features = [
    "udp",
    "tcp",
    "proto-ipv4",
    "medium-ethernet",
], optional = true }
embassy-time = { version = "0.5.1", optional = true }
# `Signal`, which wakes `EmbassySocketPool`'s task when a stream is dropped. Already a
# dependency of embassy-net 0.9.1 at this version, so this adds no new crate.
embassy-sync = { version = "0.8.0", optional = true }
# Real TLS 1.2+1.3 for Embassy via MbedTLS (hw-accelerated crypto on ESP32 targets).
# `log` routes MbedTLS's own debug logging into this crate's `log` facade; the `tls` bundle
# (default) gives X.509 parsing, ECDSA/RSA, and the record-buffer sizes FTPS/MQTT need.
#
# **Measured cost per live `Session`, ESP32-C6 against a P1S** (`embassy-hw-probe`, GitHub
# issue #292, allocator high-water marks from esp-alloc's `internal-heap-stats`): one session
# peaks ~55 KB above a ~50 KB baseline of embassy-net + esp-radio; two concurrent (FTPS
# control + data) peak at 149 KB of a 174 KB heap, i.e. ~48 KB each. The 16 KiB in + 16 KiB
# out record buffers are only two thirds of that — the rest is the SSL context, config, and
# transient X.509 parsing during the handshake.
#
# The consequence is a real ceiling, not a footnote: **three concurrent sessions do not fit**
# on a C6 at these defaults. ~29 KB of headroom remained at the two-session peak, and a third
# needs ~48 KB. That is exactly what `PrinterClient::connect_all()` asks for (MQTT + FTPS
# control + camera), so on this chip either shrink the buffers with mbedtls-rs's
# `ssl-in-content-len-<N>`/`ssl-out-content-len-<N>` features, grow the heap, or connect
# channels sequentially and drop each client when done. `disconnect_mqtt`/
# `disconnect_camera`/`FtpsClient::disconnect` do release a session's memory, but only because
# each of them drops the stream after closing it (GitHub issue #293) — `close()` alone does not:
# MbedTLS frees in `Drop`. A stream held elsewhere and merely closed still costs its ~48 KB.
# Verified on the same hardware after that fix: every stage now exits within ~150 bytes of the
# ~50 KB embassy-net + esp-radio baseline (stage 4 exit 50,040 against 91,220 before), and the
# run no longer logs "Session dropped without being closed properly".
mbedtls-rs = { version = "0.3", default-features = false, features = [
    "tls",
    "log",
], optional = true }

# Cryptographically secure random number generators for standard embedded workspace interfaces.
rand_core = { version = "0.10.1", default-features = false, optional = true }

# Concrete log sink for CLI binary (only needed on host builds)
env_logger = { version = "0.11", optional = true }

# Terminal manipulation for CLI monitor dashboard (raw mode, alternate screen, key events)
crossterm = { version = "0.29.0", optional = true }

# Argument parsing for CLI binary (derive feature for macro API)
clap = { version = "4", features = ["derive"], optional = true }

# Calendar date/time handling for CLI binary (replaces hand-rolled UTC decomposition)
time = { version = "0.3", features = ["std"], optional = true }

# Terminal display-width (not byte/char count) for CLI table column alignment — CJK/emoji rows (BUG-153)
unicode-width = { version = "0.2", optional = true }

[build-dependencies]
# Reads the ESP-IDF kconfig options that `esp-idf-svc` propagates to its dependents and
# re-emits them as `--cfg esp_idf_*` for this crate. Optional and pulled in only by the
# `esp-idf` feature, so host/embassy builds neither compile nor run it. See `build.rs`.
embuild = { version = "0.33", optional = true }

[dev-dependencies]
# Standard testing runtime components
tokio = { version = "1.52.3", features = ["full"] }

# Generates real X.509 certs in-memory for io::tokio's TLS verifier tests (custom CN/SAN
# combinations) — avoids committing cert fixtures and lets tests exercise real DER encoding
# rather than hand-crafted byte arrays.
rcgen = "0.14"

# For constructing an explicit (possibly expired) certificate validity window in
# io::tokio's CnFallbackServerVerifier expiry test.
time = "0.3"

# A TLS server that can be pinned to exactly one protocol version, for
# tests/embassy_tls_version_test.rs. mbedtls-rs cannot play this role: its
# `ServerSessionConfig` has no `max_version` field (only the client config does), so an
# all-MbedTLS loopback always lands on the highest version both ends support and could never
# prove the TLS-1.2 arm of `EmbassyTlsConnector::negotiated_version`. Not a new supply-chain
# entry — rustls is already in the lock file via `tokio-rustls`, and dev-dependencies never
# reach consumers. Preferred over spawning `openssl s_server`, which would make the suite
# depend on a binary outside cargo.
rustls = "0.23.41"

# Supplies a `critical-section` implementation for host test binaries. `mbedtls-rs` calls
# `critical_section::with` to guard its global RNG/hook state; on a real target the HAL
# registers the impl, so nothing in the crate's own dependencies provides one and an
# `embassy`-featured host link fails with undefined `_critical_section_1_0_acquire`/`_release`.
# The `std` impl (a plain mutex) is the intended stand-in for exactly this case. Dev-only, so
# no impl is ever registered for a real firmware build — registering two would be a hard error.
critical-section = { version = "1.2.0", features = ["std"] }

# A host time driver for `tests/embassy_socket_teardown_test.rs`, which runs two real
# embassy-net stacks on the host: their runners need `embassy_time::Instant::now()`, and on a
# real target the HAL supplies that driver. Dev-only for the same reason as `critical-section`
# above: a firmware build must register its own, and two would be a link error.
# `generic-queue-8`: the test has no embassy-executor, whose integrated timer queue would
# otherwise supply `__embassy_time_queue_item_from_waker`; without it the link fails.
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-8"] }

# `block_on`, `select3` and `join` for that test, which polls both stack runners and its own
# body on one thread. Already in the dependency tree via embassy-net, at this version.
embassy-futures = "0.1.2"
